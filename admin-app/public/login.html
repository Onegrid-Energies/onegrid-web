<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex, nofollow">
  <title>OneGrid WebAdmin</title>
  <link rel="icon" href="https://res.cloudinary.com/dj2ciluyx/image/upload/v1781616565/ONEGRID_WHITE_PNG_nhbudu.png" type="image/png">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <button class="icon-button theme-toggle login-theme" type="button" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a6.6 6.6 0 0 0 9.9 9.9z"/></svg><svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
    <div class="login-brand">
      <img class="brand-logo" src="https://res.cloudinary.com/dj2ciluyx/image/upload/e_trim/w_160,f_png/v1781616565/ONEGRID_WHITE_PNG_nhbudu.png" width="48" height="48" alt="">
      <div><b>OneGrid Energies</b><span>Web Content Admin</span></div>
    </div>

    <div class="notice notice-error" data-error hidden></div>
    <div class="notice notice-ok" data-ok hidden></div>

    <a class="btn btn-google" href="/auth/google" data-google hidden style="width:100%">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </a>
    <div class="divider" data-divider hidden>or use your email</div>

    <div class="tabs" role="tablist" data-tabs hidden>
      <button type="button" role="tab" aria-selected="true" data-tab="link">Email me a link</button>
      <button type="button" role="tab" aria-selected="false" data-tab="password">Password</button>
    </div>

    <form data-form="link" hidden>
      <label for="link-email">Email</label>
      <input id="link-email" name="email" type="email" autocomplete="email" required>
      <button class="btn" type="submit">Email me a sign-in link</button>
    </form>

    <form data-form="password" hidden>
      <label for="pw-email">Email</label>
      <input id="pw-email" name="email" type="email" autocomplete="username" required>
      <label for="pw-password">Password</label>
      <input id="pw-password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Sign in</button>
      <button class="link-button" type="button" data-forgot hidden>Forgot your password?</button>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
