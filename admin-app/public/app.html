<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex, nofollow">
  <title>OneGrid WebAdmin</title>
  <link rel="icon" href="https://res.cloudinary.com/dj2ciluyx/image/upload/v1781616565/ONEGRID_WHITE_PNG_nhbudu.png" type="image/png">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <!-- Phones and tablets: top bar with the menu button (the sidebar slides in from the left). -->
  <header class="mobile-bar">
    <button class="icon-button" type="button" data-menu aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="mobile-brand" href="#/"><img class="brand-logo" src="https://res.cloudinary.com/dj2ciluyx/image/upload/v1781616565/ONEGRID_WHITE_PNG_nhbudu.png" height="22" alt="OneGrid"><span><b>WebAdmin</b></span></a>
    <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a6.6 6.6 0 0 0 9.9 9.9z"/></svg><svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
  </header>
  <div class="backdrop" data-backdrop hidden></div>
  <div class="app">
    <aside class="sidebar" id="sidebar" data-sidebar>
      <div class="sidebar-top">
        <a class="brand" href="#/">
          <img class="brand-logo" src="https://res.cloudinary.com/dj2ciluyx/image/upload/v1781616565/ONEGRID_WHITE_PNG_nhbudu.png" height="30" alt="OneGrid Energies">
          <div><span>Web Content Admin</span></div>
        </a>
        <button class="icon-button sidebar-close" type="button" data-menu-close aria-label="Close menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <nav data-nav></nav>
      <div class="sidebar-footer">
        <b data-user-name></b>
        <span data-user-role></span>
        <div class="row">
          <a class="btn btn-ghost btn-small" href="#/account">My account</a>
          <button class="btn btn-ghost btn-small" type="button" data-logout>Sign out</button>
        </div>
        <div class="theme-row"><button class="btn btn-ghost btn-small theme-toggle" type="button" data-theme-toggle aria-label="Switch theme"><svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a6.6 6.6 0 0 0 9.9 9.9z"/></svg><svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span data-theme-label>Light mode</span></button></div>
      </div>
    </aside>
    <main class="main">
      <div data-view><div class="loading"><div class="spinner"></div>Loading…</div></div>
    </main>
  </div>
  <div class="toast" data-toast hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
