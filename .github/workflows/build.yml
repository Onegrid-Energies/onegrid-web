# Rebuilds the static pages whenever content, design or code changes on master (including every
# save from the admin app) and commits the result, so the repository always contains a
# ready-to-serve site. Any static host connected to the repository (Render, Netlify, Cloudflare
# Pages, cPanel Git…) can deploy it as-is, with no build step on the host.
name: Build site

on:
  push:
    branches: [master]
    paths:
      - 'content/**'
      - 'src/**'
      - 'styles.*.css'
      - 'script.*.js'
      - 'build-static-pages.mjs'
      - 'cache_burster.sh'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

# Saves made in quick succession build one after another, never in parallel.
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest master, including any earlier build commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build pages
        run: npm run build

      - name: Commit generated pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Pages already up to date."
            exit 0
          fi
          git config user.name "onegrid-site-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build site from ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "Could not push the built pages." >&2
          exit 1
